<main id="main">
<div class="lagoon-stage">
<video class="hero__video" autoplay muted loop playsinline preload="metadata" poster="../assets/images/img-1920x1080-q85.webp" aria-hidden="true"><source data-src="https://www.dropbox.com/scl/fi/ghgn0lcwpjb3nn3eptv3x/plyagh.mp4?rlkey=f90kkj7xe7v4wa0hpgbo7ccpf&amp;raw=1" type="video/mp4"></video>
<script>
  (() => {
    const video = document.querySelector('.hero__video');
    const source = video.querySelector('source');
    const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
    const updateMotion = () => {
      if (reducedMotion.matches) {
        video.pause(); video.classList.remove('is-playing'); source.removeAttribute('src'); video.load();
      } else {
        source.src = source.dataset.src; video.load();
        video.play().catch(() => video.classList.remove('is-playing'));
      }
    };
    video.addEventListener('playing', () => video.classList.add('is-playing'));
    video.addEventListener('error', () => video.classList.remove('is-playing'), true);
    video.addEventListener('pause', () => video.classList.remove('is-playing'));
    reducedMotion.addEventListener('change', updateMotion);
    updateMotion();
  })();
</script>
